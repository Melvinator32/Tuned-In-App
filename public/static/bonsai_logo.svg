<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-label="Tuned In">
  <title>Tuned In</title>
  <g fill="#2b4034">
    <!-- Trunk: an S-curve rising from the soil, thick at the base. Drawn first
         so the canopies overlap it cleanly. -->
    <path d="M83 160c-6-17 0-31 11-41 8-8 11-16 7-24-4-9-13-14-15-24-2-11 3-21 13-29l16 11
             c-8 6-12 13-10 20 2 9 11 14 15 24 5 12 1 23-8 32-9 9-13 17-11 27 1 2 1 3 2 4z"/>
    <!-- Branches out to the side canopies -->
    <path d="M96 120c-8 3-17 2-25-3-7-4-13-9-21-10l1-11c11 1 19 7 26 12 6 4 13 6 19 4z"/>
    <path d="M107 101c8 4 18 4 26-1 7-4 13-9 21-9l-1 11c-11 0-18 6-25 10-7 4-15 5-21 2z"/>

    <!-- Upper canopy -->
    <ellipse cx="100" cy="48" rx="43" ry="26"/>
    <ellipse cx="66"  cy="58" rx="28" ry="19"/>
    <ellipse cx="134" cy="58" rx="28" ry="19"/>
    <ellipse cx="84"  cy="36" rx="26" ry="19"/>
    <ellipse cx="119" cy="38" rx="24" ry="18"/>
    <rect x="58" y="46" width="84" height="27" rx="13"/>

    <!-- Left canopy -->
    <ellipse cx="52" cy="99"  rx="31" ry="18"/>
    <ellipse cx="32" cy="107" rx="21" ry="13"/>
    <ellipse cx="72" cy="107" rx="21" ry="13"/>
    <ellipse cx="45" cy="91"  rx="20" ry="13"/>
    <rect x="22" y="99" width="62" height="18" rx="9"/>

    <!-- Right canopy -->
    <ellipse cx="150" cy="101" rx="29" ry="17"/>
    <ellipse cx="133" cy="109" rx="20" ry="12"/>
    <ellipse cx="167" cy="109" rx="19" ry="12"/>
    <ellipse cx="158" cy="93"  rx="19" ry="13"/>
    <rect x="123" y="101" width="57" height="18" rx="9"/>

    <!-- Soil mound -->
    <path d="M58 162c9-11 22-16 42-16s33 5 42 16z"/>

    <!-- Shallow tray with a lip, and two feet -->
    <path d="M38 162h124c5 0 9 4 9 9s-4 9-9 9h-6l-8 16c-3 6-9 10-16 10H66c-7 0-13-4-16-10l-8-16h-6
             c-5 0-9-4-9-9s4-9 9-9z"/>
    <path d="M60 206h20l-4-10H64zM120 206h20l-4-10h-12z"/>
  </g>
</svg>
