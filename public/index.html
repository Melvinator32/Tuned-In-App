<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuned In</title>
  <link rel="icon" type="image/svg+xml" href="/static/bonsai_logo.svg" />
  <link rel="stylesheet" href="/static/style.css?v=2026-09-08-e" />
  <!-- Installable to a home screen. On iOS that is not cosmetic: WebKit
       clears stored data for sites untouched for about a week, and pages
       added to the home screen are exempt from that. -->
  <link rel="manifest" href="/manifest.webmanifest?v=2026-09-08-e" />
  <link rel="apple-touch-icon" href="/static/icon-512.png" />
  <meta name="theme-color" content="#2b4034" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tuned In" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <!-- Banner -->
  <header class="banner" id="app-banner">
    <canvas id="banner-sand" aria-hidden="true"></canvas>
    <div class="banner-left">
      <img src="/static/bonsai_logo.svg" alt="Tuned In" class="logo" id="banner-logo" />
      <div>
        <div class="title" id="banner-title">Tuned In</div>
        <div class="tagline" id="banner-tagline">What a long, strange to-do list it's been...</div>
      </div>
    </div>
    <input id="search" class="search" type="text" placeholder="Search tasks…" />
    <div class="banner-actions">
      <button id="btn-undo" class="theme-btn icon-only" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h10.5A5.5 5.5 0 0 1 20 14v0a5.5 5.5 0 0 1-5.5 5.5H8M4 8.5 8.5 4M4 8.5 8.5 13"/></svg>
      </button>
      <button id="btn-redo" class="theme-btn icon-only" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 8.5H9.5A5.5 5.5 0 0 0 4 14v0a5.5 5.5 0 0 0 5.5 5.5H16M20 8.5 15.5 4M20 8.5 15.5 13"/></svg>
      </button>
      <button id="btn-theme" class="theme-btn" title="Switch to dark"><span class="tb-ic"></span><span>Dark</span></button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="view-btn active" data-view="table">☰ List</button>
    <button class="view-btn" data-view="kanban">▤ Kanban</button>
    <button class="view-btn" data-view="today">◷ Day Plan</button>
    <button class="view-btn" data-view="matrix">◰ Prioritize</button>
    <button class="view-btn" data-view="goals">✦ Goals</button>
    <button class="view-btn" data-view="rewards">★ Rewards</button>
    <button class="view-btn" data-view="signal"><svg class="vb-ic" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6 1.5h4M6.8 1.5v4.2L3.2 11.6a2.2 2.2 0 0 0 1.9 3.4h5.8a2.2 2.2 0 0 0 1.9-3.4L9.2 5.7V1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Skill Lab</button>
    <button class="view-btn" data-view="para"><svg class="vb-ic" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="1.6" y="1.6" width="5.2" height="5.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9.2" y="1.6" width="5.2" height="5.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.6" y="9.2" width="5.2" height="5.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9.2" y="9.2" width="5.2" height="5.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg> PARA</button>
    <button class="view-btn" data-view="notes"><svg class="vb-ic" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.4 1.8h7.2l3 3v9.4a1 1 0 0 1-1 1H3.4a1 1 0 0 1-1-1V2.8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10.4 1.9v3.2h3.1M5 8.2h6M5 11h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> Notebook</button>
    <button class="view-btn" data-view="zen"><svg class="vb-ic" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="2" fill="currentColor"/><path d="M8 3.4a4.6 4.6 0 1 1-4.6 4.6M8 0.8A7.2 7.2 0 1 1 0.8 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg> Zen Garden</button>
    <span id="points-badge" class="points-badge" title="Your point balance — earn by completing tasks, spend on rewards"></span>
    <button id="alarm-toggle" class="alarm-toggle" title="Timer alarm: plays a sound and shows a banner when a running task passes its Est. Hours"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a5.5 5.5 0 0 0-5.5 5.5V13L5 16h14l-1.5-3V8.5A5.5 5.5 0 0 0 12 3zM10 19a2 2 0 0 0 4 0"/></svg></button>
    <span class="spacer"></span>
    <button id="btn-sort" class="tool-btn" title="Sort by priority — ties broken by earliest due date — with completed tasks pushed to the bottom. Applies to subtasks too; you can still drag to fine-tune afterward">↓ Sort</button>
    <button id="btn-toggle-subs" class="tool-btn" title="Expand or collapse all subtasks&#10;Shift-click: show or hide finished subtasks">⊟ Subtasks</button>
    <button id="btn-collapse-goals" class="tool-btn" title="Collapse the Values & Goal columns to one line each to shrink row height. Use a cell's caret to expand just that one.">⊟ Values/Goal</button>
    <button id="btn-tags" class="tool-btn"><svg class="vb-ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3H3v8l10 10 8-8zM7.5 7.5h.01"/></svg> Edit Tags</button>
    <button id="btn-export" class="tool-btn"><svg class="vb-ic" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 20h16"/></svg> Export</button>
    <button id="btn-edit" class="tool-btn accent-green" title="Columns, display, automations, appearance, header"><svg class="vb-ic" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.4v1.8M8 12.8v1.8M14.6 8h-1.8M3.2 8H1.4M12.7 3.3l-1.3 1.3M4.6 11.4l-1.3 1.3M12.7 12.7l-1.3-1.3M4.6 4.6L3.3 3.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Settings ▾</button>
    <button id="btn-new-task" class="tool-btn accent-teal">+ New Task</button>
    <button id="btn-new-group" class="tool-btn">+ New Group</button>
  </div>

  <!-- Board -->
  <div id="focus-timer-bar" class="focus-timer-bar">
    <span class="ft-label">⏱ Focus Timer</span>
    <span class="ft-readout" id="ft-readout">02:00</span>
    <span class="ft-set">
      <input id="ft-minutes" class="ft-minutes" type="number" min="0.5" step="0.5" value="2" title="Set the countdown length in minutes" />
      <span class="ft-unit">min</span>
    </span>
    <button id="ft-start" class="ft-btn ft-start"><svg class="ft-ic" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span id="ft-start-lab">Start</span></button>
    <button id="ft-pause" class="ft-btn ft-pause" disabled><svg class="ft-ic" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/></svg><span>Pause</span></button>
    <button id="ft-reset" class="ft-btn ft-reset"><svg class="ft-ic" viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2.2 2v4.5h4.5z" fill="currentColor"/></svg><span>Reset</span></button>
  </div>
  <main id="board">
    <!-- Replaced by the first render, or by a readable error. Shipped in the
         HTML so something is on screen before any script has run. -->
    <div id="boot-status" class="boot-status">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Loading your board&hellip;</p>
    </div>
  </main>

  <!-- Modal host -->
  <div id="modal-root"></div>

  <!-- Config formerly injected by Flask; the column types are fixed. -->
  <script>
    window.RS_CONFIG = {
      columnTypes: ["text", "status", "person", "date", "number", "priority", "goal", "check"],
    };
  </script>
  <!-- Which parts of the app this build ships, and its skin. Generated by
       scripts/build-profile.mjs from profiles/ — first, so everything sees it. -->
  <script src="/static/profile.js?v=2026-09-08-e"></script>
  <!-- Local-first builds run the API in this browser instead of on a server.
       A no-op for every other profile. -->
  <script src="/static/localdb.js?v=2026-09-08-e"></script>
  <script src="/static/xlsx.full.min.js"></script>
  <!-- Split frontend: classic scripts sharing one global scope. ORDER MATTERS —
       core first, boot.js last (it kicks off the first state load). -->
  <script src="/static/app.js?v=2026-09-08-e"></script>
  <script src="/static/board.js?v=2026-09-08-e"></script>
  <script src="/static/studio.js?v=2026-09-08-e"></script>
  <script src="/static/today.js?v=2026-09-08-e"></script>
  <script src="/static/shell.js?v=2026-09-08-e"></script>
  <script src="/static/goals.js?v=2026-09-08-e"></script>
  <script src="/static/progress.js?v=2026-09-08-e"></script>
  <script src="/static/zen.js?v=2026-09-08-e"></script>
  <script src="/static/skilllab.js?v=2026-09-08-e"></script>
  <script src="/static/ideas.js?v=2026-09-08-e"></script>
  <script src="/static/para.js?v=2026-09-08-e"></script>
  <script src="/static/notes.js?v=2026-09-08-e"></script>
  <script src="/static/career.js?v=2026-09-08-e"></script>
  <script src="/static/boot.js?v=2026-09-08-e"></script>
</body>
</html>
